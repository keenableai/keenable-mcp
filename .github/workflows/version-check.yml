name: version-check

# package.json is the single source of the npm version; server.json must name
# the same version for the MCP Registry. prepublishOnly catches a mismatch at
# publish time; this catches it when it lands, so main never carries one.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: [package.json, server.json, scripts/check-version.mjs]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # Dependency-free script: no npm install needed.
      - run: npm run check:version
