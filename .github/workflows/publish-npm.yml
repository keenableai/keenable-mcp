name: Publish to npm

# Publishes `@keenable/mcp` to npm via Trusted Publishing (OIDC): no npm
# tokens or OTPs. Same pattern as publish-python.yml in keenable-sdk. Runs when
# a GitHub Release is published; the tag must be `v<version>` and match
# package.json (e.g. v0.1.2 -> version 0.1.2). A manual run must be started
# from such a tag, never a branch. Prerelease versions (0.2.0-beta.1) go to the
# `next` dist-tag so `npm install @keenable/mcp` keeps getting the stable one.
#
# One-time setup on npmjs.com: package @keenable/mcp -> Settings -> Trusted
# publisher -> GitHub Actions, repo keenableai/keenable-mcp, workflow
# `publish-npm.yml`, environment `npm`.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: Verify and pack
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.event_name == 'release' && 'tag' || github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "::error::Manual runs must be started from a v<version> tag, not a branch."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Release tag $TAG does not match package.json version $version (expected v$version)."
            exit 1
          fi
      - run: npm run check:version
      # A stable version reaches every npx user on their next start and cannot
      # be unpublished, so its notes must carry evidence and a rollback plan
      # (rules: scripts/pr-description/, a copy of keenableai/ci-workflows/pr-description/). A prerelease goes to
      # `next` and only needs "What changes for users". The notes are read
      # from the API, not the event: a re-run replays the original event, so
      # notes fixed after a failure would otherwise never be seen.
      - name: Release notes carry evidence and a rollback plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if ! gh api "repos/$REPO/releases/tags/$TAG" --jq '.body // ""' > "$RUNNER_TEMP/notes.md"; then
            echo "::error::No published GitHub Release for $TAG; publish one with notes before releasing."
            exit 1
          fi
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          PR_BODY_FILE="$RUNNER_TEMP/notes.md" PRERELEASE="$prerelease" node scripts/pr-description/check-pr-body.mjs --release
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Pack
        run: mkdir dist && npm pack --pack-destination dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: dist/

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/@keenable/mcp
    permissions:
      id-token: write # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later; take the newest npm 11 rather
      # than whatever this Node release bundled.
      - run: npm install -g npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist/
      # The ./ prefix is required: npm reads `dist/x.tgz` as a GitHub repo.
      - name: Publish (Trusted Publishing, with provenance)
        run: |
          tarball=$(ls ./dist/*.tgz)
          version=$(tar -xOzf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).version")
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "Publishing $version with dist-tag $tag"
          npm publish "$tarball" --access public --tag "$tag"
