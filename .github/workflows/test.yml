name: test

# Unit tests plus a stdio smoke test of the discovery build: initialize must
# advertise the server metadata and tools/list must return both tools. Runs on
# every supported Node major and on the oldest MCP SDK the package accepts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        sdk: [range, "1.12.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - if: matrix.sdk != 'range'
        run: npm install --no-audit --no-fund --no-save "@modelcontextprotocol/sdk@${{ matrix.sdk }}"
      - run: npm test

  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -m unittest discover -s test/skill -p "test_*.py" -v
