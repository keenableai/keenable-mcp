name: test

# Unit tests plus a stdio smoke test of the discovery build: initialize must
# advertise the server metadata and tools/list must return both tools. Runs on
# every supported Node major and on the oldest MCP SDK the package accepts.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
        sdk: [range, "1.12.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - if: matrix.sdk != 'range'
        run: npm install --no-audit --no-fund --no-save "@modelcontextprotocol/sdk@${{ matrix.sdk }}"
      - run: npm test

  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -I -m unittest discover -s test/skill -p "test_*.py" -v
