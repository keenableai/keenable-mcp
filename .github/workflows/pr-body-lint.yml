name: pr-body-lint

# A PR description has to say why the change exists, for whom, the hypothesis
# and its kill criterion, the evidence, the rollback and where the result will
# be checked after it ships (.github/pull_request_template.md). A PR that
# changes what agents read directly (AGENT_FACING_PATHS below) must also link
# a run.
#
# scripts/pr-description/ is a verbatim copy of the shared checker in
# keenableai/ci-workflows/pr-description/ (with MEASURING.md, the guide to
# measuring). This repo is public and cannot use actions from that internal
# repo, so change the checker there first, then re-copy.
#
# pull_request_target runs this file and the checker from the base branch, so
# a PR cannot loosen the check that judges it. Nothing from the PR is checked
# out or executed: the description arrives as data in the event, and the
# changed files come from the API. That is why the token can stay read-only.
#
# Enforcement is the ruleset, not this file: make "pr-body-lint / Description"
# a required status check on main. auto-approve.yml still approves on Qodo's
# review; the required check is what stops a merge with an empty description.
# The check re-runs whenever the description, labels or commits change.
#
# Until this file is on main, PRs get no run: pull_request_target reads the
# workflow from the base branch.

on:
  pull_request_target:
    branches: [main]
    types: [opened, edited, reopened, synchronize, labeled, unlabeled, ready_for_review]

concurrency:
  group: pr-body-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Description
    # Dependabot writes its own descriptions. A skipped job satisfies a
    # required check, so its PRs are not blocked.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Collect the description and changed files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.pull_request.number }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$BODY" > "$RUNNER_TEMP/body.md"
          gh api "repos/$REPO/pulls/$NUM/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt"
      # Dependency-free script: no npm install needed.
      - name: Check the description
        env:
          PR_BODY_FILE: ${{ runner.temp }}/body.md
          PR_FILES_FILE: ${{ runner.temp }}/files.txt
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          AGENT_FACING_PATHS: |
            src/tools.js
            src/metadata.js
            skills/
        run: node scripts/pr-description/check-pr-body.mjs
