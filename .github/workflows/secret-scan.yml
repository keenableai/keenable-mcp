name: secret-scan

# Secret scanning, added after the yt-indexer key compromise (2026-08-28) —
# see soc2/INCIDENT_yt-indexer-key-compromise.md, CAPA KEE-1171. A live AWS
# key sat in a committed manifest for 229 days because nothing looked.
#
# Two different jobs, because they answer two different questions:
#
#   diff   — "does this change introduce a secret?" Blocking, scans only the
#            commits under review, so the repo's existing history backlog
#            never blocks unrelated work.
#   audit  — "what is still sitting in our history?" Weekly, non-blocking,
#            publishes a redacted report as an artifact.
#
# The jobs are mutually exclusive by event, so exactly one runs per trigger.

on:
  # Scanning both the PR and the resulting push to main is deliberate overlap,
  # not an oversight. Over the last 90 days 228 of 298 commits on main arrived
  # via a PR — those get scanned twice, costing roughly 76 runner-minutes a
  # month. The other 70 were pushed straight to main, and the push trigger is
  # the only thing covering them. Drop `push:` only once branch protection
  # makes direct pushes impossible.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Mondays 06:00 UTC — a fresh backlog to triage at the start of the week.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Blocking: only the commits this event actually introduces.
  # ---------------------------------------------------------------------------
  diff:
    name: New commits
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: gitleaks walks the commit range, and a shallow clone
          # would make the range unresolvable. Cheap here — the whole repo is
          # ~5.8 MB across 1752 commits, so this costs about 4 MB over a
          # depth-1 clone. Bounding the depth would also break the
          # force-push guard below, which needs the old tip to be present.
          fetch-depth: 0

      - uses: ./.github/actions/install-gitleaks

      - name: Verify the policy still catches what it should
        # The allowlists in .gitleaks.toml are holes in a control. This asserts
        # that planted secrets are still detected before we trust a green scan.
        # Runs unconditionally (it takes under a second) so it cannot rot.
        run: ./scripts/gitleaks-selftest.sh

      - name: Resolve what to scan
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000

          if [ "$EVENT" = "pull_request" ]; then
            echo "range=${BASE}..${HEAD}" >> "$GITHUB_OUTPUT"
            echo "Scanning commit range ${BASE}..${HEAD}"
            exit 0
          fi

          # A push. `github.event.before` is not trustworthy on its own: it is
          # all zeroes when the branch was just created, and after a force push
          # it names a commit that history replacement may have made
          # unreachable, so it need not exist in this checkout at all.
          if [ "$BEFORE" != "$zero" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "range=${BEFORE}..${SHA}" >> "$GITHUB_OUTPUT"
            echo "Scanning commit range ${BEFORE}..${SHA}"
            exit 0
          fi

          # No resolvable predecessor, so leave `range` empty and let the scan
          # step fall back to the working tree. The tempting alternatives are
          # both wrong: `${SHA}~1..${SHA}` silently examines only the tip —
          # omitting every other commit of a multi-commit initial push, and
          # failing outright on a root commit that has no parent — and scanning
          # all of history would fail permanently on the pre-existing backlog
          # rather than on this change.
          echo "::warning::No resolvable predecessor commit (new branch or force push); scanning the working tree at ${SHA} instead of a commit range. Full history is covered by the weekly audit job."

      - name: Scan
        id: scan
        env:
          RANGE: ${{ steps.scope.outputs.range }}
        run: |
          set -euo pipefail
          # A tree scan cannot miss a secret that is actually present, which is
          # what matters when no commit range resolves.
          if [ -n "$RANGE" ]; then
            set -- git . --log-opts="$RANGE"
          else
            set -- dir .
          fi
          # --redact is mandatory here — see the header of .gitleaks.toml.
          gitleaks "$@" \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: What to do about a failure
        # Scoped to the scan step, not the job. `if: failure()` would also fire
        # when the binary download, its checksum, or the policy self-test fails,
        # telling someone to rotate a credential because the network was flaky —
        # which buries the real error and starts an incident response for
        # nothing.
        if: steps.scan.outcome == 'failure'
        run: |
          cat <<'EOF'
          A secret was detected in the commits under review.

          1. Treat it as live. Rotate it first, then clean the history —
             in that order. Rewriting history does not un-leak anything.
          2. If it is a false positive, record the exception at the narrowest
             scope that fits (see the header of .gitleaks.toml):
               - a trailing `# gitleaks:allow` on the offending line, or
               - a fingerprint line in .gitleaksignore.
             Do not widen .gitleaks.toml to silence one file.
          3. Run locally to reproduce:
               gitleaks git . --redact --log-opts="<base>..<head>"
          EOF

  # ---------------------------------------------------------------------------
  # Non-blocking: the standing backlog in full history.
  # ---------------------------------------------------------------------------
  audit:
    name: Full history
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/install-gitleaks

      - name: Scan full history
        run: |
          set -euo pipefail
          gitleaks git . \
            --redact \
            --no-banner \
            --exit-code 0 \
            --report-format json \
            --report-path gitleaks-history.json
          python3 - gitleaks-history.json >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, json, sys
          try:
              findings = json.load(open(sys.argv[1]))
          except Exception:
              findings = []
          print(f'## Secrets in history: {len(findings)}\n')
          if not findings:
              print('None. ')
          else:
              print('| Count | Rule | File |')
              print('|------:|------|------|')
              counts = collections.Counter((f['File'], f['RuleID']) for f in findings)
              for (path, rule), n in sorted(counts.items(), key=lambda kv: -kv[1]):
                  print(f'| {n} | `{rule}` | `{path}` |')
              print('\nEvery entry is a credential that must be assumed exposed: '
                    'rotate it, then decide whether the history needs rewriting.')
          PY

      - name: Publish redacted report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history
          path: gitleaks-history.json
          retention-days: 30
